name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # `GITHUB_TOKEN` works here because the follow-up step
          # `workflow_dispatch`-triggers the required CI workflows on
          # the release PR head and enables auto-merge — both bypass
          # the standard `GITHUB_TOKEN`-suppresses-PR-events rule
          # (`workflow_dispatch` is the documented exemption).
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's push to the release-PR branch is made with
      # `GITHUB_TOKEN`, so `pull_request` workflows on the release PR
      # never auto-trigger and required status checks stay forever
      # "expected" → PR is BLOCKED. Manually `gh workflow run`-ing the
      # required workflows (a documented exemption from the
      # `GITHUB_TOKEN` event-suppression rule) attaches check runs to
      # the PR head SHA so required checks turn green, then `--auto`
      # lets GitHub squash-merge once they do — yielding zero-click
      # patch releases without a PAT.
      - name: Auto-dispatch CI + enable auto-merge on release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          PR_NUMBER: ${{ fromJson(steps.release.outputs.pr).number }}
        run: |
          gh workflow run lint.yml                    --ref "$PR_HEAD"
          gh workflow run build-matrix.yml            --ref "$PR_HEAD"
          gh workflow run test-core.yml               --ref "$PR_HEAD"
          gh workflow run check-gstreamer-windows.yml --ref "$PR_HEAD"
          gh pr merge "$PR_NUMBER" --auto --squash
